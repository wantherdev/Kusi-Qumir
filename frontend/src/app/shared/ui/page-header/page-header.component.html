<header class="page-header">
  <div class="kq-shell flex min-h-20 items-center justify-between gap-6">
    <a routerLink="/" aria-label="Volver al inicio de Kusi Q’umir">
      <img
        src="/assets/brand/logo-horizontal-color.svg"
        width="178"
        height="51"
        alt="Kusi Q’umir"
      />
    </a>
    <a
      class="catalog-link"
      routerLink="/tours"
      routerLinkActive="catalog-link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Explorar tours <span aria-hidden="true">→</span></a
    >
  </div>
</header>
