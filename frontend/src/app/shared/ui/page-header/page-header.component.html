<header class="page-header">
  <div class="kq-shell header-layout">
    <a
      class="header-brand"
      routerLink="/"
      aria-label="Ir al inicio de Kusi Q’umir"
      (click)="closeMenu()"
    >
      <img
        src="/assets/brand/logo-horizontal-color.svg"
        width="178"
        height="51"
        alt="Kusi Q’umir"
      />
    </a>

    <button
      #menuToggle
      class="menu-toggle"
      type="button"
      [class.menu-toggle--open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-navigation"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <nav
      id="site-navigation"
      class="site-navigation"
      [class.site-navigation--open]="menuOpen()"
      aria-label="Navegación principal"
    >
      <a
        routerLink="/tours"
        routerLinkActive="site-navigation__link--active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Tours</a
      >
      <a routerLink="/" fragment="como-viajamos" (click)="closeMenu()">Cómo viajamos</a>
      <a routerLink="/" fragment="servicios" (click)="closeMenu()">Servicios</a>
      <a
        routerLink="/informacion-institucional"
        routerLinkActive="site-navigation__link--active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Información institucional</a
      >
      <a class="kq-button kq-button--small" routerLink="/" fragment="contacto" (click)="closeMenu()"
        >Canales de atención</a
      >
    </nav>
  </div>
</header>
