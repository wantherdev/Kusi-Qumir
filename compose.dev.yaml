services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kusi_qumir
      POSTGRES_USER: kusi_qumir
      POSTGRES_PASSWORD: development-only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kusi_qumir -d kusi_qumir']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - kusi_qumir_postgres:/var/lib/postgresql/data

volumes:
  kusi_qumir_postgres:
